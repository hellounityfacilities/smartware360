<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5C58">
<title>SMARTWARE 360 — Warehouse Control</title>
<style>
:root{
  --ground:#E9E7E1; --panel:#FFFFFF; --panel-2:#F4F2EC;
  --ink:#1D2321; --ink-2:#5C6562; --ink-3:#8A918E;
  --line:#CFCCC3; --line-2:#E2DFD7;
  --teal:#0F5C58; --teal-d:#0A4340; --teal-l:#E3EFEE;
  --amber:#E09400; --amber-l:#FDF1DA;
  --ok:#2E7D46; --ok-l:#E4F1E7;
  --warn:#C08004; --warn-l:#FBF0D8;
  --crit:#B3261E; --crit-l:#FAE5E3;
  --over:#1F5FA8; --over-l:#E4EDF7;
  --dead:#6B3FA0; --dead-l:#EEE8F6;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic","Segoe UI Arabic",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
}
body.ar{font-size:15.5px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.015em;line-height:1.2}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px} h4{font-size:14px}
.mono{font-family:var(--mono);font-size:.88em;letter-spacing:-.02em}
.muted{color:var(--ink-2)} .dim{color:var(--ink-3)}
.sm{font-size:13px} .xs{font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{display:flex;min-height:100vh}
body[dir="rtl"] #app{flex-direction:row-reverse}
#rail{
  width:216px;flex:0 0 216px;background:var(--ink);color:#DDE3E1;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
#brand{padding:18px 16px 14px;border-bottom:1px solid #2E3633}
#brand .bn{font-size:15px;font-weight:700;letter-spacing:.02em;color:#fff}
#brand .bs{color:#8B9793;font-size:11px;margin-top:2px}
#nav{padding:8px 0;flex:1}
.navgroup{padding:12px 16px 4px;font-size:10.5px;color:#6E7A76;letter-spacing:.09em;text-transform:uppercase}
.navitem{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 16px;background:none;border:0;
  text-align:start;cursor:pointer;color:#C8D1CE;font-size:13.5px;border-inline-start:3px solid transparent;
}
.navitem:hover{background:#262E2B;color:#fff}
.navitem.on{background:#2B3532;color:#fff;border-inline-start-color:var(--amber);font-weight:600}
.navitem .ic{width:18px;text-align:center;opacity:.85;font-size:14px}
.navitem .badge{margin-inline-start:auto;background:var(--amber);color:#2B2100;border-radius:20px;padding:0 6px;font-size:11px;font-weight:700}
#main{flex:1;min-width:0;display:flex;flex-direction:column}

#top{
  display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap;
}
#top .grow{flex:1}
.topsel{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;font-size:13px}
#burger{display:none}
#netdot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
#netdot.off{background:var(--crit)}
#content{padding:20px;max-width:1280px;width:100%}

/* ---------- primitives ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row.tight{gap:8px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:4px}
.hdr{margin-bottom:14px}
.hdr p{margin:4px 0 0;color:var(--ink-2);font-size:13.5px;max-width:70ch}
hr.sep{border:0;border-top:1px solid var(--line-2);margin:14px 0}

.btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--teal);color:#fff;border:1px solid var(--teal);
  padding:8px 14px;border-radius:var(--r);cursor:pointer;font-size:13.5px;font-weight:600;
}
.btn:hover{background:var(--teal-d)}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.warn{background:var(--amber);border-color:var(--amber);color:#2B2100}
.btn.danger{background:var(--crit);border-color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.navitem:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--amber);outline-offset:2px
}
.big{padding:16px 18px;font-size:15px;border-radius:var(--r)}

label.f{display:block;font-size:12px;color:var(--ink-2);margin-bottom:3px}
input.f,select.f,textarea.f{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)
}
input.f:disabled{background:var(--panel-2);color:var(--ink-2)}
.field{flex:1;min-width:150px;margin-bottom:10px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:start;font-weight:600;color:var(--ink-2);font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--panel-2)}
.t-scroll{overflow-x:auto}
td.r,th.r{text-align:end}

.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--ok-l);color:var(--ok)}
.t-warn{background:var(--warn-l);color:var(--warn)}
.t-crit{background:var(--crit-l);color:var(--crit)}
.t-over{background:var(--over-l);color:var(--over)}
.t-dead{background:var(--dead-l);color:var(--dead)}
.t-neutral{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line-2)}
.t-teal{background:var(--teal-l);color:var(--teal-d)}

.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-inline-start:3px solid var(--line)}
.kpi .k{font-size:12px;color:var(--ink-2)}
.kpi .v{font-size:24px;font-weight:680;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.kpi.ok{border-inline-start-color:var(--ok)} .kpi.warn{border-inline-start-color:var(--amber)}
.kpi.crit{border-inline-start-color:var(--crit)} .kpi.teal{border-inline-start-color:var(--teal)}
.kpi.over{border-inline-start-color:var(--over)} .kpi.dead{border-inline-start-color:var(--dead)}

/* ---------- hero: the daily equation ---------- */
#eq{background:var(--ink);color:#EAEFED;border-radius:var(--r);padding:18px 18px 14px}
#eq .eqhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
#eq .eqhead .d{color:#8B9793;font-size:12.5px}
#eq h2{color:#fff;font-size:17px}
.eqline{display:flex;align-items:flex-end;gap:2px;flex-wrap:wrap}
.eqterm{padding:6px 10px 5px;min-width:74px}
.eqterm .l{font-size:10.5px;color:#8B9793;line-height:1.3}
.eqterm .n{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eqop{font-size:17px;color:#6E7A76;padding:0 2px 9px;font-weight:600}
.eqterm.res{background:#2B3532;border-radius:var(--r);border-bottom:3px solid var(--amber)}
.eqterm.res .n{color:#fff;font-size:24px}
.eqterm.open{background:#242C2A;border-radius:var(--r)}
.eqterm .n.pos{color:#7FCF9B} .eqterm .n.neg{color:#F0A49E}

/* ---------- health dial ---------- */
.dial{display:flex;align-items:center;gap:16px}
.dialsvg{flex:0 0 auto}
.healthnum{font-size:34px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* ---------- one-minute control ---------- */
#omc{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.omcell{background:var(--panel);padding:18px 16px;min-height:150px;display:flex;flex-direction:column}
.omcell .cap{font-size:11px;letter-spacing:.14em;color:var(--ink-3);font-weight:700}
.omcell .big{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:10px 0 2px;padding:0;font-variant-numeric:tabular-nums}
.omcell .sub{font-size:12.5px;color:var(--ink-2);margin-top:auto}
.omcell.risk .big{color:var(--crit)}
.omcell.action .big{color:var(--amber)}

/* ---------- digital twin ---------- */
.zone{margin-bottom:16px}
.zonehead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.racks{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.rack{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;cursor:pointer;text-align:start}
.rack:hover{border-color:var(--teal)}
.rack .rn{font-family:var(--mono);font-size:12px;font-weight:700}
.rack .ru{font-size:11px;color:var(--ink-2);margin:3px 0 5px;font-variant-numeric:tabular-nums}
.fill{height:7px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.fill i{display:block;height:100%}
.f-ok{background:var(--ok)} .f-warn{background:var(--amber)} .f-crit{background:var(--crit)} .f-low{background:var(--over)}

/* ---------- heat map ---------- */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.hcell{padding:8px;border-radius:var(--r);cursor:pointer;border:1px solid transparent;min-height:60px}
.hcell .hn{font-size:11.5px;font-weight:600;line-height:1.25}
.hcell .hq{font-family:var(--mono);font-size:11px;margin-top:3px}
.h-ok{background:var(--ok-l);color:#1C5730;border-color:#BFDCC8}
.h-warn{background:var(--warn-l);color:#7A5200;border-color:#EBD79C}
.h-crit{background:var(--crit-l);color:#8A1C16;border-color:#EFBDB9}
.h-over{background:var(--over-l);color:#154577;border-color:#B9CFE8}
.h-dead{background:var(--dead-l);color:#4C2B73;border-color:#CFC0E4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.tab.on{border-bottom-color:var(--teal);color:var(--ink);font-weight:600}

/* ---------- drawer / modal ---------- */
#scrim{position:fixed;inset:0;background:rgba(20,26,24,.5);z-index:60;display:none}
#scrim.on{display:block}
#drawer{
  position:fixed;top:0;inset-inline-end:0;height:100vh;width:min(560px,100%);background:var(--ground);
  z-index:70;transform:translateX(102%);transition:transform .22s ease;overflow-y:auto;box-shadow:-2px 0 18px rgba(0,0,0,.18)
}
body[dir="rtl"] #drawer{transform:translateX(-102%)}
#drawer.on{transform:none !important}
#drawer .dh{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:2}
#drawer .db{padding:16px}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-2);padding:0 4px}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}

/* ---------- misc ---------- */
.stepflow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.step{padding:3px 9px;border-radius:20px;background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line-2)}
.step.done{background:var(--ok-l);color:var(--ok);border-color:#BFDCC8}
.step.now{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}
.note{background:var(--amber-l);border:1px solid #EBD79C;border-inline-start:3px solid var(--amber);border-radius:var(--r);padding:10px 12px;font-size:13px}
.note.teal{background:var(--teal-l);border-color:#BCD8D6;border-inline-start-color:var(--teal)}
.note.crit{background:var(--crit-l);border-color:#EFBDB9;border-inline-start-color:var(--crit)}
.why{font-size:12.5px;color:var(--ink-2);margin-top:5px;padding-inline-start:10px;border-inline-start:2px solid var(--line)}
.empty{text-align:center;padding:36px 16px;color:var(--ink-2)}
.empty p{margin:6px 0 14px;font-size:13.5px}
#toast{position:fixed;inset-inline-start:50%;transform:translateX(-50%);bottom:22px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13.5px;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:92vw}
.toast.bad{background:var(--crit)}
.bar{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qty{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding-inline-end:4px}
.msg{padding:10px 12px;border-radius:var(--r);max-width:86%;font-size:13.5px}
.msg.u{background:var(--teal);color:#fff;align-self:flex-end;border-end-end-radius:0}
.msg.a{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-end-start-radius:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--teal);color:var(--teal-d)}
#scanbox{background:var(--ink);border-radius:var(--r);padding:14px;color:#DDE3E1;text-align:center}
#scanvid{width:100%;max-width:340px;border-radius:var(--r);background:#000;display:none;margin:0 auto}
.abc{display:grid;grid-template-columns:auto repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:13px}
.abc>div{background:var(--panel);padding:10px;text-align:center}
.abc .hd{background:var(--panel-2);font-weight:600;font-size:12px;color:var(--ink-2)}
.abc .cnt{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}

@media print{
  #rail,#top,.noprint{display:none !important}
  body{background:#fff} #content{padding:0;max-width:none}
  .panel{border-color:#999;break-inside:avoid}
}
@media (max-width:1080px){ #omc{grid-template-columns:repeat(2,1fr)} .g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  #rail{position:fixed;z-index:80;transform:translateX(-102%);transition:transform .2s}
  body[dir="rtl"] #rail{transform:translateX(102%)}
  #rail.on{transform:none !important}
  #burger{display:inline-flex}
  #content{padding:14px}
  .g3,.g2{grid-template-columns:1fr}
  .omcell{min-height:110px} .omcell .big{font-size:24px}
  h1{font-size:21px}
}
</style>
</head>
<body class="en" dir="ltr">
<div id="app">
  <aside id="rail">
    <div id="brand">
      <div class="bn" id="brandName">SMARTWARE 360</div>
      <div class="bs" id="brandSub">Unity Facilities Management</div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div id="main">
    <header id="top">
      <button class="btn ghost sm" id="burger" onclick="UI.toggleRail()">☰</button>
      <select class="topsel" id="whSel" onchange="UI.setWarehouse(this.value)"></select>
      <select class="topsel" id="userSel" onchange="UI.setUser(this.value)"></select>
      <span class="grow"></span>
      <span class="xs muted num" id="clock"></span>
      <span id="netdot" title="connection"></span>
      <button class="btn ghost sm" onclick="UI.toggleLang()" id="langBtn">العربية</button>
    </header>
    <main id="content"></main>
  </div>
</div>
<div id="scrim" onclick="UI.closeDrawer()"></div>
<aside id="drawer" role="dialog" aria-modal="true"><div class="dh"><h3 id="drawerTitle"></h3><button class="x" onclick="UI.closeDrawer()" aria-label="Close">×</button></div><div class="db" id="drawerBody"></div></aside>
<div id="toast"></div>
<script>
"use strict";
/* ==========================================================================
   SMARTWARE 360 — Phase 1 prototype
   Single file. No build step, no CDN, no external calls.
   Layer 1: data model + seed. Stock is NEVER stored as an editable number —
   every balance is derived from the append-only transaction ledger.
   ========================================================================== */

/* ---- deterministic RNG so the demo is identical on every machine ---- */
let _s = 20260915;
function rnd(){ _s = (_s * 1664525 + 1013904223) % 4294967296; return _s / 4294967296; }
function ri(a,b){ return a + Math.floor(rnd()*(b-a+1)); }
function pick(a){ return a[ri(0,a.length-1)]; }

const DAY = 86400000;
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const T0 = TODAY.getTime();
const dstr = ms => new Date(ms).toISOString().slice(0,10);
const tstr = ms => new Date(ms).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

const DB = {
  settings:{
    company:'Unity Facilities Management & Services',
    product:'SMARTWARE 360',
    currency:'QAR',
    lang:'en',
    allowNegative:false,
    adjustThresholds:[{max:500,role:'Warehouse Manager'},{max:5000,role:'Operations Manager'},{max:Infinity,role:'General Manager'}],
    deadDays:90,
    reportTime:'06:30',
    taxRate:0,            // configurable — nothing about tax is hard-coded
    fefo:true
  },
  roles:{
    'Super Administrator':['*'],
    'Warehouse Manager':['dash','omc','inv','scan','recv','issue','xfer','count','req','adj','approve','twin','heat','intel','sup','rep','ask','audit','set'],
    'Storekeeper':['dash','inv','scan','recv','issue','xfer','count','req','twin','ask'],
    'Procurement Officer':['dash','inv','intel','sup','rep','ask'],

    'Department User':['req','inv','ask'],
    'Auditor':['dash','inv','rep','audit','ask','intel']
  },
  users:[
    {id:'U1',name:'Irshaad Foumie',role:'Super Administrator',wh:'*'},
    {id:'U2',name:'Rashid Al-Kuwari',role:'Warehouse Manager',wh:'*'},
    {id:'U3',name:'Saleem Hassan',role:'Storekeeper',wh:'WH-01'},
    {id:'U4',name:'Anil Kumar',role:'Storekeeper',wh:'WH-02'},
    {id:'U5',name:'Fatima Nasser',role:'Procurement Officer',wh:'*'},
    {id:'U6',name:'Jomon George',role:'Finance',wh:'*'},
    {id:'U7',name:'Mary Fernandez',role:'Department User',wh:'*'},
    {id:'U8',name:'External Auditor',role:'Auditor',wh:'*'}
  ],
  warehouses:[
    {id:'WH-01',name:'Main Warehouse',nameAr:'المستودع الرئيسي',site:'Industrial Area St 38, Doha'},
    {id:'WH-02',name:'Maintenance Store',nameAr:'مخزن الصيانة',site:'Al Sadd Tower, Doha'},
    {id:'WH-03',name:'Cleaning Materials Store',nameAr:'مخزن مواد التنظيف',site:'Industrial Area St 38, Doha'},
    {id:'WH-04',name:'Spare Parts Store',nameAr:'مخزن قطع الغيار',site:'Birkat Al Awamer'}
  ],
  departments:[
    {id:'D1',name:'Cleaning Operations',nameAr:'عمليات التنظيف'},
    {id:'D2',name:'MEP Maintenance',nameAr:'صيانة الكهروميكانيك'},
    {id:'D3',name:'HSE',nameAr:'الصحة والسلامة'},
    {id:'D4',name:'Fleet & Logistics',nameAr:'الأسطول واللوجستيات'},
    {id:'D5',name:'Administration',nameAr:'الإدارة'}
  ],
  projects:[
    {id:'P1',name:'Lusail Towers FM Contract',nameAr:'عقد أبراج لوسيل'},
    {id:'P2',name:'Msheireb Retail Cleaning',nameAr:'تنظيف مشيرب'},
    {id:'P3',name:'Hamad Airport Support',nameAr:'دعم مطار حمد'},
    {id:'P4',name:'Education City Facilities',nameAr:'مرافق المدينة التعليمية'}
  ],

/* ---------------- balance engine (derived, never stored) ---------------- */
const BAL = {dirty:true, byItemLoc:{}, byItem:{}, byItemWh:{}, byBatch:{}, lastMove:{}};
function rebuild(){
  const a={},b={},c={},d={},lm={};
  for(const t of DB.txns){
    if(t.reversed) continue;
    const loc = t.locId||''; const it = t.itemId;
    a[it+'|'+loc] = (a[it+'|'+loc]||0)+t.qty;
    b[it] = (b[it]||0)+t.qty;
    const wh = t.wh||(LOC(loc)||{}).wh||'';
    c[it+'|'+wh] = (c[it+'|'+wh]||0)+t.qty;
    if(t.batch) d[it+'|'+t.batch] = {qty:((d[it+'|'+t.batch]||{}).qty||0)+t.qty, expiry:t.expiry||((d[it+'|'+t.batch]||{}).expiry||'')};
    if(t.qty<0 || t.type==='Receive') lm[it] = Math.max(lm[it]||0, t.ts);
  }
  BAL.byItemLoc=a; BAL.byItem=b; BAL.byItemWh=c; BAL.byBatch=d; BAL.lastMove=lm; BAL.dirty=false;
}
const sync = () => { if(BAL.dirty) rebuild(); };
function onHand(itemId,wh){ sync(); return wh&&wh!=='*' ? (BAL.byItemWh[itemId+'|'+wh]||0) : (BAL.byItem[itemId]||0); }
function atLoc(itemId,locId){ sync(); return BAL.byItemLoc[itemId+'|'+locId]||0; }
function locsFor(itemId,wh){ sync();
  return Object.keys(BAL.byItemLoc).filter(k=>k.startsWith(itemId+'|')&&BAL.byItemLoc[k]>0)
    .map(k=>({loc:k.split('|')[1], qty:BAL.byItemLoc[k]}))
    .filter(x=>!wh||wh==='*'||(LOC(x.loc)||{}).wh===wh)
    .sort((a,b)=>b.qty-a.qty); }
function batchesFor(itemId){ sync();
  return Object.keys(BAL.byBatch).filter(k=>k.startsWith(itemId+'|')&&BAL.byBatch[k].qty>0)
    .map(k=>({batch:k.split('|')[1], qty:BAL.byBatch[k].qty, expiry:BAL.byBatch[k].expiry}))
    .sort((a,b)=> (a.expiry||'9999').localeCompare(b.expiry||'9999')); }
function reserved(itemId,wh){
  return DB.requests.filter(r=>r.status==='Reserved'&&(!wh||wh==='*'||r.wh===wh))
    .reduce((s,r)=>s+r.lines.filter(l=>l.itemId===itemId).reduce((x,l)=>x+(l.approvedQty-l.issuedQty),0),0); }
const available = (itemId,wh) => onHand(itemId,wh) - reserved(itemId,wh);

/* ---------------- movement analytics ---------------- */
function issuesIn(itemId,days,wh){
  const from = Date.now()-days*DAY;
  return DB.txns.filter(t=>!t.reversed&&t.itemId===itemId&&t.type==='Issue'&&t.ts>=from&&(!wh||wh==='*'||t.wh===wh))
    .reduce((s,t)=>s-t.qty,0); }
const avgDaily = (itemId,wh) => +(issuesIn(itemId,90,wh)/90).toFixed(3);
function reorderPoint(it,wh){
  const ad = avgDaily(it.id,wh), lead = it.lead;
  const safety = Math.ceil(ad*lead*0.5);
  return {avgDaily:ad, lead, safety, rop:Math.ceil(ad*lead+safety)}; }
function daysToZero(it,wh){ const ad=avgDaily(it.id,wh); if(ad<=0) return Infinity; return Math.floor(available(it.id,wh)/ad); }
function lastMoved(itemId){ sync(); return BAL.lastMove[itemId]||0; }
function idleDays(itemId){ const lm=lastMoved(itemId); return lm? Math.floor((Date.now()-lm)/DAY) : 999; }

function statusOf(it,wh){
  const oh = onHand(it.id,wh), av = available(it.id,wh);
  const idle = idleDays(it.id);
  if(oh<=0) return 'crit';
  if(idle>=DB.settings.deadDays && oh>0) return 'dead';
  if(av<=it.min*0.4) return 'crit';
  if(av<=it.reorder) return 'warn';
  if(oh>it.max*1.15) return 'over';
  return 'ok';
}
const STATUS_LABEL = {ok:'Healthy',warn:'Low stock',crit:'Critical',over:'Overstock',dead:'Dead stock'};
const STATUS_AR = {ok:'سليم',warn:'مخزون منخفض',crit:'حرج',over:'فائض',dead:'راكد'};

function valueOf(it,wh){ return onHand(it.id,wh)*it.cost; }
function inventoryValue(wh){ return DB.items.reduce((s,i)=>s+Math.max(0,valueOf(i,wh)),0); }
function itemsIn(wh){ return DB.items.filter(i=>!wh||wh==='*'||onHand(i.id,wh)!==0||i.homeWh===wh); }

/* ---------------- expiry (FEFO) ---------------- */
function expiringBatches(wh,days){
  const out=[]; const lim = Date.now()+days*DAY;
  DB.items.filter(i=>i.expiryControlled).forEach(i=>{
    batchesFor(i.id).forEach(b=>{
      if(!b.expiry) return;
      const e = new Date(b.expiry).getTime();
      if(e<=lim){
        const ls = locsFor(i.id,wh);
        if(wh&&wh!=='*'&&!ls.length) return;
        out.push({item:i, batch:b.batch, expiry:b.expiry, qty:b.qty, days:Math.floor((e-Date.now())/DAY), value:b.qty*i.cost});
      }
    });
  });
  return out.sort((a,b)=>a.days-b.days);
}
function fefoBatch(itemId){ const bs=batchesFor(itemId).filter(b=>b.expiry); return bs.length?bs[0]:null; }

/* ---------------- day movement ---------------- */
function dayFlows(wh,dayStart){
  const s = dayStart!==undefined?dayStart:T0, e = s+DAY;
  const inRange = DB.txns.filter(t=>!t.reversed&&t.ts>=s&&t.ts<e&&(!wh||wh==='*'||t.wh===wh));
  const sum = f => inRange.filter(f).reduce((a,t)=>a+Math.abs(t.qty),0);
  return {
    receipts:sum(t=>t.type==='Receive'),
    returnsIn:sum(t=>t.type==='Return'),
    transferIn:sum(t=>t.type==='Transfer'&&t.qty>0),
    issues:sum(t=>t.type==='Issue'),
    returnsOut:sum(t=>t.type==='ReturnToSupplier'),
    transferOut:sum(t=>t.type==='Transfer'&&t.qty<0),
    adjustments:inRange.filter(t=>t.type==='Adjust').reduce((a,t)=>a+t.qty,0),
    count:inRange.length
  };
}
function closingStock(wh,at){
  const lim = at!==undefined?at:Date.now();
  return DB.txns.filter(t=>!t.reversed&&t.ts<lim&&(!wh||wh==='*'||t.wh===wh)).reduce((a,t)=>a+t.qty,0);
}
function dailyLedger(wh){
  const open = closingStock(wh,T0), f = dayFlows(wh);
  const close = open + f.receipts + f.returnsIn + f.transferIn - f.issues - f.returnsOut - f.transferOut + f.adjustments;
  return Object.assign({opening:open, closing:close}, f);
}

/* ---------------- warehouse health score ---------------- */
function healthScore(wh){
  const items = itemsIn(wh); const n = items.length||1;
  const low = items.filter(i=>['warn','crit'].includes(statusOf(i,wh))).length;
  const outs = items.filter(i=>onHand(i.id,wh)<=0).length;
  const over = items.filter(i=>statusOf(i,wh)==='over').length;
  const dead = items.filter(i=>statusOf(i,wh)==='dead').length;
  const expired = expiringBatches(wh,0).length;
  const pendReq = DB.requests.filter(r=>r.status==='Requested'&&(wh==='*'||r.wh===wh)).length;
  const pendAdj = DB.adjustments.filter(a=>a.status==='Pending'&&(wh==='*'||a.wh===wh)).length;
  const acc = countAccuracy(wh);
  const util = storageUtil(wh);
  const parts = [
    {k:'Stock accuracy', w:22, v:acc/100, why:`Physical counts matched the system on ${acc.toFixed(1)}% of counted lines.`},
    {k:'Availability', w:20, v:1-Math.min(1,low/n*1.5), why:`${low} of ${n} SKUs are at or below reorder level.`},
    {k:'Out of stock', w:12, v:1-Math.min(1,outs/n*3), why:`${outs} SKUs are at zero.`},
    {k:'Dead stock', w:12, v:1-Math.min(1,dead/n*3), why:`${dead} SKUs have not moved for ${DB.settings.deadDays}+ days.`},
    {k:'Overstock', w:8, v:1-Math.min(1,over/n*3), why:`${over} SKUs hold more than their maximum level.`},
    {k:'Expiry control', w:8, v:expired?0.2:1, why: expired?`${expired} batches are already expired.`:'No expired batches in stock.'},
    {k:'Open transactions', w:10, v:1-Math.min(1,(pendReq+pendAdj)/12), why:`${pendReq} requests and ${pendAdj} adjustments are waiting for approval.`},
    {k:'Storage utilisation', w:8, v:util>95?0.4:(util<25?0.6:1), why:`Racking is ${util.toFixed(0)}% utilised.`}
  ];
  const score = Math.round(parts.reduce((s,p)=>s+p.w*Math.max(0,Math.min(1,p.v)),0));
  return {score, parts, band: score>=90?'Excellent':score>=80?'Good':score>=65?'Fair':'Needs attention'};
}
function countAccuracy(wh){
  const cs = DB.counts.filter(c=>c.status==='Closed'&&(wh==='*'||c.wh===wh));
  let lines=0, exact=0;
  cs.forEach(c=>c.lines.forEach(l=>{ lines++; if(l.physical===l.system) exact++; }));
  return lines? (exact/lines*100) : 100;
}
function storageUtil(wh){
  sync(); const ls = wh==='*'?DB.locations:locsOf(wh);
  let cap=0, used=0;
  ls.forEach(l=>{ cap+=l.capacity;
    Object.keys(BAL.byItemLoc).forEach(k=>{ if(k.endsWith('|'+l.id)) used+=Math.max(0,BAL.byItemLoc[k]); }); });
  return cap? Math.min(100, used/cap*100):0;
}
function rackUtil(wh){
  sync(); const map={};
  locsOf(wh).forEach(l=>{ const key=l.zone+'|'+l.rack;
    map[key] = map[key]||{zone:l.zone,rack:l.rack,cap:0,used:0,bins:[]};
    let u=0; Object.keys(BAL.byItemLoc).forEach(k=>{ if(k.endsWith('|'+l.id)) u+=Math.max(0,BAL.byItemLoc[k]); });
    map[key].cap+=l.capacity; map[key].used+=u; map[key].bins.push({loc:l,used:u});
  });
  return Object.values(map);
}

/* ---------------- ABC / XYZ ---------------- */
function abcxyz(wh){
  const items = itemsIn(wh).map(i=>{
    const annual = issuesIn(i.id,90,wh)*4;
    return {i, value:annual*i.cost, cv:demandCV(i.id,wh)};
  }).sort((a,b)=>b.value-a.value);
  const total = items.reduce((s,x)=>s+x.value,0)||1;
  let cum=0;
  items.forEach(x=>{ cum+=x.value; const p=cum/total;
    x.abc = p<=0.8?'A':p<=0.95?'B':'C';
    x.xyz = x.cv<0.5?'X':x.cv<1?'Y':'Z';
    x.cls = x.abc+x.xyz; });
  return items;
}
function demandCV(itemId,wh){
  const m=[0,0,0]; for(let k=0;k<3;k++){
    const from=Date.now()-(k+1)*30*DAY, to=Date.now()-k*30*DAY;
    m[k]=DB.txns.filter(t=>!t.reversed&&t.itemId===itemId&&t.type==='Issue'&&t.ts>=from&&t.ts<to&&(wh==='*'||t.wh===wh)).reduce((s,t)=>s-t.qty,0);
  }
  const mean=(m[0]+m[1]+m[2])/3; if(!mean) return 2;
  const sd=Math.sqrt(m.reduce((s,x)=>s+(x-mean)**2,0)/3);
  return sd/mean;
}

/* ---------------- risk, reorder, anomalies, forecast ---------------- */
function riskScore(it,wh){
  const r = reorderPoint(it,wh), av = available(it.id,wh), dz = daysToZero(it,wh);
  const alt = DB.items.filter(x=>x.cat===it.cat&&x.id!==it.id&&x.supplier!==it.supplier).length;
  const f=[];
  let s=0;
  if(dz<it.lead){ s+=35; f.push(`Cover of ${dz===Infinity?'—':dz} days is shorter than the ${it.lead}-day supplier lead time.`); }
  else if(dz<it.lead*2){ s+=18; f.push(`Only ${dz} days of cover against a ${it.lead}-day lead time.`); }
  if(av<=r.rop){ s+=20; f.push(`Available stock ${av} is at or below the reorder point of ${r.rop}.`); }
  if(av<=0){ s+=20; f.push('Item is out of stock.'); }
  if(it.lead>=14){ s+=12; f.push(`Long supplier lead time (${it.lead} days).`); }
  if(!alt){ s+=8; f.push('No alternative supplier is recorded for this category.'); }
  const ax = abcxyz(wh).find(x=>x.i.id===it.id);
  if(ax&&ax.abc==='A'){ s+=10; f.push('Class A item — high share of inventory spend.'); }
  return {score:Math.min(100,s), factors:f, band: s>=70?'HIGH':s>=40?'MEDIUM':'LOW'};
}
function reorderList(wh){
  return itemsIn(wh).map(it=>{
    const r=reorderPoint(it,wh), av=available(it.id,wh);
    return Object.assign({it, available:av, suggest:Math.max(it.reorderQty, Math.ceil(r.rop*1.6-av)), dz:daysToZero(it,wh)}, r);
  }).filter(x=>x.available<=x.rop||x.available<=x.it.reorder)
    .sort((a,b)=>a.dz-b.dz);
}
function deadStock(wh){
  return itemsIn(wh).filter(i=>onHand(i.id,wh)>0&&idleDays(i.id)>=DB.settings.deadDays)
    .map(i=>({it:i, idle:idleDays(i.id), qty:onHand(i.id,wh), value:valueOf(i,wh)}))
    .sort((a,b)=>b.value-a.value);
}
function anomalies(wh){
  const out=[];
  DB.items.forEach(i=>{
    const recent = issuesIn(i.id,30,wh), base = issuesIn(i.id,90,wh)/3;
    if(base>4 && recent > base*1.3)
      out.push({sev:'warn', title:`${i.name} consumption is up ${Math.round((recent/base-1)*100)}% this month`,
        why:`30-day issues are ${recent} ${i.uom} against a 90-day monthly average of ${base.toFixed(0)}. Flagged for review — this is a deviation, not evidence of misuse.`});
  });
  DB.txns.filter(t=>!t.reversed&&t.type==='Adjust'&&Math.abs(t.qty*(ITEM(t.itemId)||{cost:0}).cost)>2000&&t.ts>Date.now()-30*DAY)
    .forEach(t=>out.push({sev:'crit', title:`Large adjustment on ${(ITEM(t.itemId)||{}).name}`,
      why:`${t.qty>0?'+':''}${t.qty} ${(ITEM(t.itemId)||{}).uom} valued at ${money(Math.abs(t.qty*(ITEM(t.itemId)||{cost:0}).cost))} on ${dstr(t.ts)}, entered by ${t.user}. Reason recorded: ${t.reason||'—'}.`}));
  const night = DB.txns.filter(t=>!t.reversed&&t.ts>Date.now()-14*DAY&&(new Date(t.ts).getHours()<5||new Date(t.ts).getHours()>=22));
  if(night.length) out.push({sev:'warn', title:`${night.length} transactions recorded outside working hours`,
    why:`Movements posted between 22:00 and 05:00 in the last 14 days. Check against the shift roster before treating this as an exception.`});
  DB.items.forEach(i=>{ const ret=DB.txns.filter(t=>!t.reversed&&t.itemId===i.id&&t.type==='Return'&&t.ts>Date.now()-60*DAY).length;
    if(ret>=4) out.push({sev:'warn', title:`Repeated returns of ${i.name}`, why:`${ret} return transactions in 60 days. Possible quality or over-issue problem.`}); });
  return out.slice(0,12);
}
function tomorrow(wh){
  const rl = reorderList(wh);
  const crit = rl.filter(x=>x.dz<=3);
  const exp = expiringBatches(wh,30);
  const ds = deadStock(wh);
  const idleSoon = itemsIn(wh).filter(i=>{ const d=idleDays(i.id); return d>=DB.settings.deadDays-14&&d<DB.settings.deadDays&&onHand(i.id,wh)>0; });
  const idleValue = idleSoon.reduce((s,i)=>s+valueOf(i,wh),0);
  const anom = anomalies(wh).filter(a=>a.sev==='warn'&&a.title.includes('consumption'));
  const lines=[];
  if(crit.length) lines.push({t:`${crit.length} item${crit.length>1?'s':''} may reach critical stock within 3 days`, d:crit.slice(0,4).map(x=>`${x.it.name} — ${x.dz} day${x.dz===1?'':'s'} of cover left`).join(' · ')});
  if(rl.length) lines.push({t:`${rl.length} purchase recommendation${rl.length>1?'s':''} are waiting to be raised`, d:`Estimated commitment ${money(rl.reduce((s,x)=>s+x.suggest*x.it.cost,0))}.`});
  if(exp.length) lines.push({t:`${exp.length} batch${exp.length>1?'es':''} expire within 30 days`, d:`${money(exp.reduce((s,e)=>s+e.value,0))} of stock. Issue these first under FEFO.`});
  if(idleValue>0) lines.push({t:`${money(idleValue)} of stock will be classed as dead if not used`, d:`${idleSoon.length} SKUs are approaching the ${DB.settings.deadDays}-day inactivity threshold.`});
  if(anom.length) lines.push({t:anom[0].title, d:anom[0].why});
  const excess = DB.warehouses.filter(w=>w.id!==wh).map(w=>{
    const cand = itemsIn(w.id).find(i=>onHand(i.id,w.id)>i.max&&wh!=='*'&&available(i.id,wh)<=i.reorder);
    return cand?{w,i:cand}:null; }).filter(Boolean)[0];
  if(excess) lines.push({t:`Transfer instead of buying`, d:`${excess.w.name} holds surplus ${excess.i.name}. Moving stock avoids a purchase order.`});
  return {lines, dead:ds.reduce((s,d)=>s+d.value,0)};
}

/* ---------------- suppliers ---------------- */
function supplierScore(s){
  const its = DB.items.filter(i=>i.supplier===s.id);
  const recs = DB.txns.filter(t=>!t.reversed&&t.type==='Receive'&&its.some(i=>i.id===t.itemId));
  const rets = DB.txns.filter(t=>!t.reversed&&t.type==='ReturnToSupplier'&&its.some(i=>i.id===t.itemId));
  const onTime = recs.length? Math.max(60, 100 - (s.lead>10?12:4) - (rets.length*3)) : 85;
  const quality = recs.length? Math.max(55, 100 - rets.length*6) : 88;
  const priceIdx = Math.round(100 - (s.lead*0.8));
  const score = Math.round(onTime*0.4+quality*0.35+priceIdx*0.25);
  return {onTime, quality, priceIdx, score, receipts:recs.length, returns:rets.length, items:its.length,
    band: score>=88?'Preferred':score>=75?'Approved':'Watch'};
}

const AFTER = {};

function toast(msg, bad){
  const d=document.createElement('div'); d.className='toast'+(bad?' bad':''); d.textContent=msg;
  document.getElementById('toast').appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .4s';setTimeout(()=>d.remove(),400);},2600);

function renderTop(){

function renderNav(){

/* small shared builders */
function kpi(label, value, sub, cls){ return `<div class="kpi ${cls||''}"><div class="k">${esc(L(label))}</div><div class="v">${value}</div>${sub?`<div class="s">${esc(sub)}</div>`:''}</div>`; }
function tag(status){ const cls={ok:'t-ok',warn:'t-warn',crit:'t-crit',over:'t-over',dead:'t-dead'}[status]||'t-neutral';
  const lbl = DB.settings.lang==='ar'?STATUS_AR[status]:STATUS_LABEL[status];
  return `<span class="tag ${cls}">${esc(lbl||status)}</span>`; }
function pageHdr(title, sub, actions){
  return `<div class="hdr between"><div><h1>${esc(L(title))}</h1>${sub?`<p>${esc(sub)}</p>`:''}</div><div class="row tight noprint">${actions||''}</div></div>`;
}
function whLabel(){ return UI.wh==='*' ? (DB.settings.lang==='ar'?'كل المستودعات':'All warehouses') : wname(DB.warehouses.find(w=>w.id===UI.wh)); }
function dial(score){
  const r=38,c=2*Math.PI*r, off=c*(1-score/100);
  const col = score>=90?'var(--ok)':score>=80?'var(--teal)':score>=65?'var(--amber)':'var(--crit)';
  return `<svg class="dialsvg" width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="9"></circle>
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 48 48)"></circle></svg>`;
}
function bars(rows){ // tiny inline bar chart, no library
  const max = Math.max(1,...rows.map(r=>r.v));
  return `<div class="stack" style="gap:8px">`+rows.map(r=>`<div>
    <div class="between xs" style="margin-bottom:3px"><span>${esc(r.l)}</span><span class="num muted">${esc(r.t||num(r.v))}</span></div>
    <div class="bar"><i style="width:${(r.v/max*100).toFixed(1)}%;background:${r.c||'var(--teal)'}"></i></div></div>`).join('')+`</div>`;
}
function sparkline(vals,w,h){
  w=w||260;h=h||54; const max=Math.max(1,...vals), min=Math.min(...vals);
  const pts = vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-((v-min)/((max-min)||1))*(h-8)-4).toFixed(1)}`).join(' ');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="var(--teal)" stroke-width="2"/></svg>`;
}
function csv(name, rows){
  const body = rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  logAudit('Export','Report: '+name,'','', 'CSV download');
  toast('Exported '+name);
}

async function startCamera(){
  const v=document.getElementById('scanvid'), m=document.getElementById('scanmsg');
  if(!('BarcodeDetector' in window)){ m.textContent='This browser has no built-in barcode reader. Use the field below, or a USB/Bluetooth scanner — it types straight into the box.'; return; }
  try{
    SCAN.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    v.srcObject=SCAN.stream; v.style.display='block'; await v.play();
    m.textContent='Point the camera at a barcode.';
    const det = new BarcodeDetector();
    const tick = async ()=>{ if(!SCAN.stream) return;
      try{ const codes = await det.detect(v);
        if(codes.length){ document.getElementById('scanIn').value = codes[0].rawValue; doScan(); return; }
      }catch(e){}
      requestAnimationFrame(tick); };
    tick();
  }catch(e){ m.textContent='Camera permission was refused. Type the code below instead.'; }
}
function stopCamera(){ if(SCAN.stream){ SCAN.stream.getTracks().forEach(t=>t.stop()); SCAN.stream=null; } }

AFTER.recv = ()=>recvLoc();
function recvLoc(){
  const it=ITEM(document.getElementById('rItem').value), wh=document.getElementById('rWh').value;
  const sel=document.getElementById('rLoc'); if(!sel) return;
  const rec = suggestLocation(it,wh);
  const pool = locsOf(wh);
  sel.innerHTML = pool.map(l=>`<option value="${l.id}" ${rec.loc===l.id?'selected':''}>${esc(l.id)} · cap ${l.capacity}</option>`).join('');
  document.getElementById('rWhy').textContent = rec.why;
  const exp=document.getElementById('rExp'); exp.disabled=!it.expiryControlled;
  const b=document.getElementById('rBatch'); b.disabled=!it.batched;
  if(it.batched&&!b.value) b.value='B'+dstr(Date.now()).replace(/-/g,'').slice(2)+'-'+it.sku.split('-')[1];
}
function suggestLocation(it,wh){
  sync();
  const existing = locsFor(it.id,wh)[0];
  if(existing){ const l=LOC(existing.loc); const used=existing.qty;
    if(used < l.capacity*0.85) return {loc:existing.loc, why:`Recommended ${existing.loc} — this item is already stored here and the bin is ${Math.round(used/l.capacity*100)}% full.`}; }
  const sameCat = DB.items.filter(x=>x.cat===it.cat&&x.id!==it.id);
  for(const s of sameCat){ const ls=locsFor(s.id,wh)[0]; if(!ls) continue;
    const l=LOC(ls.loc); let used=0; Object.keys(BAL.byItemLoc).forEach(k=>{ if(k.endsWith('|'+l.id)) used+=Math.max(0,BAL.byItemLoc[k]); });
    if(used<l.capacity*0.7) return {loc:l.id, why:`Recommended ${l.id} — other ${it.cat} is stored here and the location has ${Math.round(100-used/l.capacity*100)}% capacity available.`}; }
  const free = locsOf(wh).map(l=>{ let used=0; Object.keys(BAL.byItemLoc).forEach(k=>{ if(k.endsWith('|'+l.id)) used+=Math.max(0,BAL.byItemLoc[k]); });
    return {l,free:l.capacity-used}; }).sort((a,b)=>b.free-a.free)[0];
  return {loc:free.l.id, why:`Recommended ${free.l.id} — emptiest location in this warehouse (${free.free} units of space).`};
}
function doReceive(){
  const it=ITEM(document.getElementById('rItem').value);
  const wh=document.getElementById('rWh').value, qty=+document.getElementById('rQty').value;
  const loc=document.getElementById('rLoc').value;
  if(!(qty>0)) return toast('Enter a quantity greater than zero.',true);
  const exp=document.getElementById('rExp').value;
  if(it.expiryControlled&&!exp) return toast('This item is expiry controlled. Enter the expiry date on the delivery.',true);
  const cond=document.getElementById('rCond').value;
  const tx=postSafe({type:'Receive', itemId:it.id, qty, locId:loc, wh,
    batch:document.getElementById('rBatch').value, expiry:exp,
    ref:document.getElementById('rPO').value+' / '+document.getElementById('rDN').value,
    party:document.getElementById('rSup').value, partyType:'Supplier',
    note:(cond==='Good'?'':'QUARANTINE — ')+document.getElementById('rNote').value,
    photo:document.getElementById('rPhoto').checked});
  logAudit('Receive', it.sku+' @ '+loc, onHand(it.id,wh)-qty, onHand(it.id,wh), tx.ref);
  toast(`Received ${qty} ${it.uom} of ${it.name} into ${loc}.`);
  UI.filters.item=null; UI.render();
}
function postSafe(t){
  if(!navigator.onLine){ DB.queue.push(t); toast('Offline — transaction queued and will sync automatically.'); }
  return post(t);
}

function issueInfo(qtyOnly){

function doIssue(){
  const it=ITEM(document.getElementById('iItem').value), wh=document.getElementById('iWh').value;
  const q=+document.getElementById('iQty').value, loc=document.getElementById('iLoc').value;

  const tx=postSafe({type:'Issue', itemId:it.id, qty:-q, locId:loc, wh, batch:document.getElementById('iBatch').value,

    note:document.getElementById('iNote').value});

}

function xferLocs(){
  const it=ITEM(document.getElementById('xItem').value);
  const fw=document.getElementById('xFromWh').value, tw=document.getElementById('xToWh').value;
  const src=locsFor(it.id,fw);
  document.getElementById('xFrom').innerHTML = src.length? src.map(l=>`<option value="${l.loc}">${esc(l.loc)} · ${l.qty}</option>`).join('') : `<option value="">— no stock —</option>`;
  const rec=suggestLocation(it,tw);
  document.getElementById('xTo').innerHTML = locsOf(tw).map(l=>`<option value="${l.id}" ${rec.loc===l.id?'selected':''}>${esc(l.id)}</option>`).join('');
}
function doTransfer(){
  const it=ITEM(document.getElementById('xItem').value), q=+document.getElementById('xQty').value;
  const from=document.getElementById('xFrom').value, to=document.getElementById('xTo').value;
  const fw=document.getElementById('xFromWh').value, tw=document.getElementById('xToWh').value;
  if(!from) return toast('There is no stock of this item in the source warehouse.',true);
  if(from===to) return toast('Source and destination locations are the same.',true);
  if(!(q>0)) return toast('Enter a quantity greater than zero.',true);
  if(q>atLoc(it.id,from)&&!DB.settings.allowNegative) return toast(`Blocked: ${from} holds only ${atLoc(it.id,from)} ${it.uom}.`,true);
  const ref='TRF-'+String(2000+DB.txns.length);
  const note=document.getElementById('xNote').value;
  postSafe({type:'Transfer', itemId:it.id, qty:-q, locId:from, wh:fw, ref, note:`To ${to}. ${note}`});
  postSafe({type:'Transfer', itemId:it.id, qty:q, locId:to, wh:tw, ref, note:`From ${from}. ${note}`});
  logAudit('Transfer', it.sku, from, to, ref+' · '+q+' '+it.uom);
  toast(`Transferred ${q} ${it.uom} from ${from} to ${to}.`);
  UI.filters.item=null; UI.render();
}

function countStart(){
  const wh=UI.wh==='*'?'WH-01':UI.wh;
  const zones=[...new Set(locsOf(wh).map(l=>l.zone))];
  return pageHdr('Stock count', DB.settings.lang==='ar'?'اختر النطاق ثم أدخل الكميات الفعلية':'Pick a scope, then key in what is physically on the shelf. The system shows expected quantities only after you select.') + `
  <div class="panel pad" style="max-width:620px">
    <div class="row">
      <div class="field"><label class="f">${esc(L('Warehouse'))}</label><select class="f" id="cWh" onchange="UI.render()">

        ${zones.map(z=>`<option>${z}</option>`).join('')}</select></div>
    </div>
    <button class="btn big" onclick="countBuild()">${DB.settings.lang==='ar'?'ابدأ الجرد':'Start count sheet'}</button>
  </div>
  ${DB.counts.length?`<div class="panel pad" style="margin-top:14px"><h3 style="margin-bottom:10px">${DB.settings.lang==='ar'?'عمليات جرد سابقة':'Closed counts'}</h3>
    <table><thead><tr><th>Count</th><th>${esc(L('Warehouse'))}</th><th>Date</th><th>By</th><th class="r">Lines</th><th class="r">Accuracy</th></tr></thead><tbody>
    ${DB.counts.slice().reverse().map(c=>`<tr><td class="mono xs">${esc(c.id)}</td><td>${esc(wname(DB.warehouses.find(w=>w.id===c.wh)))}</td>
      <td class="xs">${dstr(c.ts)}</td><td class="xs">${esc(c.by)}</td><td class="r num">${c.lines.length}</td>
      <td class="r"><span class="tag ${c.accuracy>=98?'t-ok':c.accuracy>=95?'t-warn':'t-crit'}">${c.accuracy}%</span></td></tr>`).join('')}
    </tbody></table></div>`:''}`;
}
function countBuild(){
  const wh=document.getElementById('cWh').value, zone=document.getElementById('cZone').value;
  sync();
  const lines=[];
  Object.keys(BAL.byItemLoc).forEach(k=>{
    const [itemId,loc]=k.split('|'); const q=BAL.byItemLoc[k];
    if(q<=0||!loc) return; const l=LOC(loc); if(!l||l.wh!==wh) return; if(zone&&l.zone!==zone) return;
    lines.push({itemId, loc, system:q, physical:q, variance:0, note:''});
  });
  if(!lines.length) return toast('No stock is recorded in that scope.',true);
  COUNT={wh, scope:`${wh}${zone?' / Zone '+zone:''}`, lines:lines.slice(0,25), ts:Date.now()};
  UI.render();
}
function countSet(ix,v){ const l=COUNT.lines[ix]; l.physical=+v||0; l.variance=l.physical-l.system; UI.render(); }
function countClose(){
  const bad=COUNT.lines.filter(l=>Math.abs(l.variance)>0&&!l.note.trim());
  if(bad.length) return toast(`${bad.length} variance line${bad.length>1?'s':''} still need${bad.length>1?'':'s'} an explanation.`,true);
  let posted=0;
  COUNT.lines.forEach(l=>{ if(!l.variance) return;
    postSafe({type:'Adjust', itemId:l.itemId, qty:l.variance, locId:l.loc, wh:COUNT.wh,
      ref:'SC-'+String(200+DB.counts.length), reason:'Physical count variance — '+l.note});
    logAudit('Count variance', ITEM(l.itemId).sku+' @ '+l.loc, l.system, l.physical, l.note); posted++; });
  const acc=+(COUNT.lines.filter(l=>!l.variance).length/COUNT.lines.length*100).toFixed(1);
  DB.counts.push({id:'SC-'+String(200+DB.counts.length), wh:COUNT.wh, ts:Date.now(), by:UI.user.name, status:'Closed', lines:COUNT.lines, accuracy:acc});
  toast(`Count closed at ${acc}% accuracy. ${posted} variance${posted===1?'':'s'} posted.`);
  COUNT=null; UI.render();
}

function approveReq(id){
  const r=DB.requests.find(x=>x.id===id);
  r.lines.forEach(l=>{ l.approvedQty = Math.min(l.qty, Math.max(0,available(l.itemId,r.wh))); });
  const short=r.lines.filter(l=>l.approvedQty<l.qty);
  r.status='Approved'; r.history.push({s:'Approved',ts:Date.now(),by:UI.user.name});
  logAudit('Approve request', r.id, 'Requested','Approved', r.reason);
  toast(short.length? `${r.id} approved with ${short.length} line${short.length>1?'s':''} reduced to available stock.` : `${r.id} approved in full.`);
  UI.closeDrawer(); UI.render();
}
function reserveReq(id){
  const r=DB.requests.find(x=>x.id===id);
  r.status='Reserved'; r.history.push({s:'Reserved',ts:Date.now(),by:UI.user.name});
  logAudit('Reserve stock', r.id, 'Approved','Reserved','');
  toast(`Stock reserved for ${r.id}. Physical quantity is unchanged; available quantity has dropped.`);
  UI.closeDrawer(); UI.render();
}
function issueReq(id){
  const r=DB.requests.find(x=>x.id===id);
  let n=0;
  r.lines.forEach(l=>{
    const q=l.approvedQty-l.issuedQty; if(q<=0) return;
    const loc=(locsFor(l.itemId,r.wh)[0]||{}).loc;
    if(!loc) return;
    postSafe({type:'Issue', itemId:l.itemId, qty:-Math.min(q,atLoc(l.itemId,loc)), locId:loc, wh:r.wh,
      ref:r.id, party:r.project, partyType:'Project', note:r.dept+' — against material request'});
    l.issuedQty=l.approvedQty; n++;
  });
  r.status='Completed'; r.history.push({s:'Issued',ts:Date.now(),by:UI.user.name},{s:'Completed',ts:Date.now(),by:'System'});
  logAudit('Issue against request', r.id,'Reserved','Completed', n+' lines');
  toast(`${r.id} issued and closed. ${n} line${n===1?'':'s'} posted to the ledger.`);
  UI.closeDrawer(); UI.render();
}

    <div class="note" style="margin-bottom:12px">Adjustments never overwrite a balance. They post a correcting transaction that stays visible in the ledger.</div>
    <div class="row">
      <div class="field" style="flex:2"><label class="f">${esc(L('Item'))}</label><select class="f" id="aItem">${DB.items.map(i=>`<option value="${i.id}">${esc(iname(i))} — ${esc(i.sku)}</option>`).join('')}</select></div>
      <div class="field"><label class="f">${esc(L('Quantity'))} ±</label><input class="f num" id="aQty" type="number" value="-2"></div>
    </div>
    <div class="field"><label class="f">${esc(L('Warehouse'))}</label><select class="f" id="aWh">${DB.warehouses.map(w=>`<option value="${w.id}">${esc(wname(w))}</option>`).join('')}</select></div>
    <div class="field"><label class="f">${esc(L('Reason'))}</label><textarea class="f" id="aWhy" rows="2" placeholder="Damaged, expired, found during count, theft investigation…"></textarea></div>
    <label class="sm" style="display:flex;gap:6px;align-items:center;margin-bottom:12px"><input type="checkbox" id="aPhoto" checked> Photo evidence attached</label>
    <button class="btn" onclick="saveAdj()">Submit for approval</button>`);
}
function saveAdj(){
  const it=ITEM(document.getElementById('aItem').value), q=+document.getElementById('aQty').value;
  const why=document.getElementById('aWhy').value.trim();
  if(!q) return toast('Enter a non-zero adjustment quantity.',true);
  if(why.length<5) return toast('A reason is required before an adjustment can be raised.',true);
  const val=Math.abs(q*it.cost);
  const role=DB.settings.adjustThresholds.find(t=>val<=t.max).role;
  const a={id:'ADJ-'+String(910+DB.adjustments.length), ts:Date.now(), wh:document.getElementById('aWh').value,
    itemId:it.id, qty:q, reason:why, by:UI.user.name, value:val, status:'Pending', approver:role, photo:document.getElementById('aPhoto').checked};
  DB.adjustments.push(a); logAudit('Raise adjustment', it.sku, '', q, why);
  toast(`${a.id} raised. Value ${money(val)} routes to ${role} for approval.`);
  UI.closeDrawer(); UI.render();
}
function decideAdj(id,ok){
  const a=DB.adjustments.find(x=>x.id===id); const it=ITEM(a.itemId);
  if(ok){
    const loc=(locsFor(a.itemId,a.wh)[0]||{}).loc||locsOf(a.wh)[0].id;
    const before=onHand(a.itemId,a.wh);
    postSafe({type:'Adjust', itemId:a.itemId, qty:a.qty, locId:loc, wh:a.wh, ref:a.id, reason:a.reason, photo:a.photo});
    a.status='Approved';
    logAudit('Approve adjustment', it.sku+' @ '+loc, before, onHand(a.itemId,a.wh), a.reason);
    toast(`${a.id} approved and posted.`);
  } else { a.status='Rejected'; logAudit('Reject adjustment', it.sku,'Pending','Rejected',a.reason); toast(`${a.id} rejected. Stock is unchanged.`); }
  UI.render();
}

function showRack(wh,zone,rack){
  sync();

  const rows=[];
  bins.forEach(l=>{ Object.keys(BAL.byItemLoc).forEach(k=>{ if(!k.endsWith('|'+l.id)) return;
    const q=BAL.byItemLoc[k]; if(q<=0) return; rows.push({loc:l, itemId:k.split('|')[0], qty:q}); }); });
  const cap=bins.reduce((s,b)=>s+b.capacity,0), used=rows.reduce((s,r)=>s+r.qty,0);
  UI.openDrawer(`${wh} / Zone ${zone} / ${rack}`, `
    <div class="grid g3" style="margin-bottom:12px">
      ${kpi('Capacity',num(cap),'units')}${kpi('Occupied',num(used),'units','teal')}
      ${kpi('Utilisation',(cap?used/cap*100:0).toFixed(0)+'%',(used/cap>0.92?'No room to receive':used/cap<0.3?'Space available':'Healthy'), used/cap>0.92?'crit':used/cap<0.3?'over':'ok')}
    </div>
    ${rows.length?`<div class="panel"><div class="t-scroll"><table><thead><tr><th>Bin</th><th>${esc(L('Item'))}</th><th class="r">${esc(L('Quantity'))}</th><th class="r">${esc(L('Value'))}</th><th>${esc(L('Status'))}</th></tr></thead><tbody>
      ${rows.sort((a,b)=>a.loc.id.localeCompare(b.loc.id)).map(r=>{const it=ITEM(r.itemId);
        return `<tr class="clk" onclick="showItem('${r.itemId}')"><td class="mono xs">${esc(r.loc.shelf)}/${esc(r.loc.bin)}</td>
        <td>${esc(iname(it))}<div class="xs mono dim">${esc(it.sku)}</div></td><td class="r qty">${num(r.qty)}</td>
        <td class="r num">${money(r.qty*it.cost).replace('QAR ','')}</td><td>${tag(statusOf(it,wh))}</td></tr>`;}).join('')}
      </tbody></table></div></div>`:`<div class="empty"><h4>This rack is empty</h4><p>Receive stock and the location recommendation will offer it.</p></div>`}`);
}

function iReorder(wh){

    ${kpi('Purchase recommendations',rl.length,'below reorder point','warn')}

    <th class="r">Safety</th><th class="r">${esc(L('Reorder point'))}</th><th class="r">Cover</th><th class="r">Suggested</th><th class="r">${esc(L('Value'))}</th><th class="noprint"></th></tr></thead><tbody>
    ${rl.map(x=>`<tr class="clk" onclick="showItem('${x.it.id}')">
      <td>${esc(iname(x.it))}<div class="xs mono dim">${esc(x.it.sku)} · ${esc(DB.suppliers.find(s=>s.id===x.it.supplier).name)}</div></td>

      <td class="r num">${x.avgDaily}</td><td class="r num">${x.lead}d</td><td class="r num">${num(x.safety)}</td>
      <td class="r qty">${num(x.rop)}</td>
      <td class="r"><span class="tag ${x.dz<x.it.lead?'t-crit':x.dz<x.it.lead*2?'t-warn':'t-neutral'}">${x.dz===Infinity?'—':x.dz+'d'}</span></td>
      <td class="r qty">${num(x.suggest)}</td><td class="r num">${money(x.suggest*x.it.cost).replace('QAR ','')}</td>
      <td class="noprint"><button class="btn sm" onclick="event.stopPropagation();raisePR('${x.it.id}')">Raise PR</button></td></tr>`).join('')}
  </tbody></table></div>

}
function iForecast(wh){
  const list=itemsIn(wh).map(i=>({i, ad:avgDaily(i.id,wh), av:available(i.id,wh), dz:daysToZero(i,wh)}))
    .filter(x=>x.ad>0).sort((a,b)=>a.dz-b.dz).slice(0,14);
  const proj=(x,d)=>Math.max(0,Math.round(x.av-x.ad*d));
  return `<div class="note" style="margin-bottom:14px">Projections use 90 days of issue history and assume consumption continues at the same rate. Seasonality, new project mobilisations and one-off issues are not yet modelled — treat the dates as a warning window, not a promise.</div>
  <div class="panel"><div class="t-scroll"><table><thead><tr>
    <th>${esc(L('Item'))}</th><th class="r">Now</th><th class="r">Avg/day</th><th class="r">+7d</th><th class="r">+14d</th><th class="r">+30d</th>
    <th class="r">Reaches zero</th><th>Recommendation</th></tr></thead><tbody>
    ${list.map(x=>{const r=reorderPoint(x.i,wh);
      return `<tr class="clk" onclick="showItem('${x.i.id}')"><td>${esc(iname(x.i))}<div class="xs mono dim">${esc(x.i.sku)}</div></td>
      <td class="r qty">${num(x.av)}</td><td class="r num">${x.ad}</td>
      <td class="r num ${proj(x,7)<=0?'':''}" style="${proj(x,7)<=0?'color:var(--crit);font-weight:600':''}">${num(proj(x,7))}</td>
      <td class="r num" style="${proj(x,14)<=0?'color:var(--crit);font-weight:600':''}">${num(proj(x,14))}</td>
      <td class="r num" style="${proj(x,30)<=0?'color:var(--crit);font-weight:600':''}">${num(proj(x,30))}</td>
      <td class="r"><span class="tag ${x.dz<x.i.lead?'t-crit':x.dz<30?'t-warn':'t-ok'}">${x.dz===Infinity?'—':'~'+x.dz+' days'}</span></td>
      <td class="xs">${x.dz<x.i.lead*1.5? `Order ${num(Math.max(x.i.reorderQty,Math.ceil(r.rop*1.6-x.av)))} ${esc(x.i.uom)} now — supplier needs ${x.i.lead} days.` : 'No action needed yet.'}</td></tr>`;}).join('')}
  </tbody></table></div></div>`;
}

function iExpiry(wh){
  const all=expiringBatches(wh,90);

function iABC(wh){

    CX:'Bulk buy, low review frequency',CY:'Bulk buy, tolerate variability',CZ:'Minimum attention — candidate for rationalisation'};
  return `<div class="note" style="margin-bottom:14px">ABC ranks SKUs by annualised consumption value (A = top 80% of spend). XYZ ranks demand predictability from 3 months of issue history (X = steady, Z = erratic).</div>

function iRisk(wh){

let CHAT=[];
const SUGGEST=['What should I reorder today?','Which items have not moved for 90 days?','How many safety helmets do we have?',

VIEWS.ask = function(){

  <div class="panel pad" style="max-width:820px">
    <div class="chat" id="chat">${CHAT.length?CHAT.map(m=>`<div class="msg ${m.r}">${m.r==='u'?esc(m.t):m.t}</div>`).join('')
      :`<div class="msg a">Ask me about stock levels, what moved, what to buy, what is expiring, or where something is stored. I answer from ${esc(whLabel())} only.</div>`}</div>
    <div class="row tight" style="margin-top:12px">
      <input class="f" id="askIn" style="flex:1" placeholder="${DB.settings.lang==='ar'?'اكتب سؤالك…':'Type your question…'}" onkeydown="if(event.key==='Enter')doAsk()">
      <button class="btn ghost" onclick="askVoice()" title="Voice">🎤</button>
      <button class="btn" onclick="doAsk()">Ask</button>
    </div>
    <div class="chips">${SUGGEST.map(s=>`<button class="chip" onclick="doAsk('${s.replace(/'/g,"\'")}')">${esc(s)}</button>`).join('')}</div>
  </div>`;
};
AFTER.ask = ()=>{ const c=document.getElementById('chat'); if(c) c.scrollTop=c.scrollHeight; const i=document.getElementById('askIn'); if(i) i.focus(); };
function askVoice(){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return toast('This browser has no speech recognition. Type the question instead.',true);
  const r=new SR(); r.lang = DB.settings.lang==='ar'?'ar-QA':'en-GB'; r.interimResults=false;
  r.onresult=e=>{ document.getElementById('askIn').value=e.results[0][0].transcript; doAsk(); };
  r.onerror=()=>toast('Could not hear that. Try again or type it.',true);
  r.start(); toast('Listening…');
}
function doAsk(preset){
  const q = preset || document.getElementById('askIn').value.trim();
  if(!q) return;
  CHAT.push({r:'u',t:q});
  CHAT.push({r:'a',t:answer(q)});
  if(!preset) document.getElementById('askIn').value='';
  logAudit('Ask the warehouse','Query','',q,'');
  UI.render();
}
function answer(qRaw){
  const q=qRaw.toLowerCase(), wh=UI.wh;
  const has=(...w)=>w.some(x=>q.includes(x));
  const tbl=(head,rows)=>`<table style="margin-top:6px"><thead><tr>${head.map((h,i)=>`<th class="${i?'r':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'r':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  if(has('reorder','buy','purchase','order today','اشتري','طلب شراء')){
    const rl=reorderList(wh).slice(0,8);
    if(!rl.length) return 'Nothing is below its reorder point in '+esc(whLabel())+' today.';
    return `${rl.length} item${rl.length>1?'s are':' is'} at or below the reorder point in ${esc(whLabel())}, an estimated ${money(rl.reduce((s,x)=>s+x.suggest*x.it.cost,0))} of purchasing.`+
      tbl(['Item','Available','Reorder point','Suggested'],rl.map(x=>[esc(iname(x.it)),num(x.available),num(x.rop),num(x.suggest)]));
  }
  if(has('not moved','dead','idle','راكد','لم تتحرك')){
    const ds=deadStock(wh).slice(0,8);
    if(!ds.length) return 'Every item has moved within the last '+DB.settings.deadDays+' days.';
    return `${ds.length} SKU${ds.length>1?'s have':' has'} not moved for ${DB.settings.deadDays}+ days, worth ${money(deadStock(wh).reduce((s,d)=>s+d.value,0))}.`+
      tbl(['Item','Idle days','Qty','Value'],ds.map(d=>[esc(iname(d.it)),d.idle>900?'never':d.idle,num(d.qty),money(d.value).replace('QAR ','')]));
  }
  if(has('expir','انتهاء','صلاحية')){
    const days = q.includes('week')?7:q.includes('month')?30:q.includes('today')?0:60;
    const ex=expiringBatches(wh,days);
    if(!ex.length) return `No batch expires within ${days} days in ${esc(whLabel())}.`;
    return `${ex.length} batch${ex.length>1?'es':''} expire${ex.length>1?'':'s'} within ${days} days, worth ${money(ex.reduce((s,e)=>s+e.value,0))}. Issue these first under FEFO.`+
      tbl(['Item','Batch','Expires','Qty'],ex.slice(0,8).map(e=>[esc(iname(e.item)),`<span class="mono xs">${esc(e.batch)}</span>`,e.expiry,num(e.qty)]));
  }
  if(has('issued today','issue today','what did we issue','صرفنا اليوم')){
    const ts=DB.txns.filter(t=>!t.reversed&&t.type==='Issue'&&t.ts>=T0&&(wh==='*'||t.wh===wh));
    if(!ts.length) return 'Nothing has been issued yet today.';
    return `${ts.length} issue transaction${ts.length>1?'s':''} today totalling ${num(ts.reduce((s,t)=>s-t.qty,0))} units.`+
      tbl(['Item','Qty','To'],ts.slice(0,10).map(t=>[esc(iname(ITEM(t.itemId))),num(-t.qty),esc(t.party)]));
  }
  if(has('below minimum','below min','low stock','running low','منخفض')){
    const low=itemsIn(wh).filter(i=>['warn','crit'].includes(statusOf(i,wh)));
    if(!low.length) return 'No item is below its minimum level.';
    return `${low.length} item${low.length>1?'s are':' is'} at or below reorder level in ${esc(whLabel())}.`+
      tbl(['Item','Available','Minimum'],low.slice(0,10).map(i=>[esc(iname(i)),num(available(i.id,wh)),num(i.min)]));
  }
  if(has('most expensive','highest value','expensive','أغلى')){
    const top=itemsIn(wh).map(i=>({i,v:valueOf(i,wh)})).sort((a,b)=>b.v-a.v).slice(0,5);
    return `The five highest-value holdings in ${esc(whLabel())}:`+
      tbl(['Item','Qty','Value'],top.map(x=>[esc(iname(x.i)),num(onHand(x.i.id,wh)),money(x.v).replace('QAR ','')]));
  }
  if(has('excess','surplus','which warehouse','فائض')){
    const rows=[];
    DB.warehouses.forEach(w=>{ itemsIn(w.id).filter(i=>onHand(i.id,w.id)>i.max).slice(0,3)
      .forEach(i=>rows.push([esc(wname(w)),esc(iname(i)),num(onHand(i.id,w.id)),num(i.max)])); });
    if(!rows.length) return 'No warehouse is holding stock above its maximum level.';
    return `Stock above maximum level, by warehouse — these are transfer candidates before any new purchase:`+tbl(['Warehouse','Item','On hand','Maximum'],rows.slice(0,10));
  }
  if(has('consume','consumed','consumption','استهلك')){
    const prj=DB.projects.find(p=>q.includes(p.name.toLowerCase().split(' ')[0]))||DB.projects[0];
    const ts=DB.txns.filter(t=>!t.reversed&&t.type==='Issue'&&t.party===prj.name&&t.ts>Date.now()-30*DAY);
    if(!ts.length) return `No issues are recorded against ${esc(prj.name)} in the last 30 days.`;
    const byItem=Object.entries(ts.reduce((m,t)=>{m[t.itemId]=(m[t.itemId]||0)-t.qty;return m;},{})).sort((a,b)=>b[1]-a[1]).slice(0,8);
    return `${esc(prj.name)} consumed ${num(ts.reduce((s,t)=>s-t.qty,0))} units over ${ts.length} issues in the last 30 days, valued at ${money(ts.reduce((s,t)=>s-t.qty*ITEM(t.itemId).cost,0))}.`+
      tbl(['Item','Units'],byItem.map(([id,v])=>[esc(iname(ITEM(id))),num(v)]));
  }
  if(has('value','worth','قيمة') && !has('item')){
    const ds=deadStock(wh).reduce((s,d)=>s+d.value,0);
    return `${esc(whLabel())} holds ${money(inventoryValue(wh))} of stock across ${itemsIn(wh).length} SKUs. ${money(ds)} of that is sitting in items that have not moved for ${DB.settings.deadDays}+ days.`;
  }
  if(has('health','صحة')){
    const h=healthScore(wh);
    return `Warehouse health is ${h.score}/100 — ${h.band}. ${esc(h.parts.slice().sort((a,b)=>a.v-b.v).slice(0,2).map(p=>p.why).join(' '))}`;
  }
  if(has('where','location','موقع','أين')){
    const it=findItem(qRaw.replace(/where(\s+is)?|located|location|the|أين|موقع/gi,'').trim());
    if(!it) return 'I could not match that to an item. Try the SKU or the exact item name.';
    const ls=locsFor(it.id,wh);
    if(!ls.length){
      const other=DB.warehouses.filter(w=>onHand(it.id,w.id)>0);
      return `${esc(iname(it))} has no stock in ${esc(whLabel())}.`+(other.length?` It is held in ${other.map(w=>esc(wname(w))+' ('+num(onHand(it.id,w.id))+' '+esc(it.uom)+')').join(', ')}. Switch warehouse in the header to see bin locations.`:'');
    }
    return `${esc(iname(it))} is stored at:`+tbl(['Location','Qty'],ls.map(l=>[`<span class="mono xs">${esc(l.loc)}</span>`,num(l.qty)]));
  }
  // "how many X do we have"
  const m = qRaw.replace(/how many|do we have|كم لدينا|عدد|\?/gi,'').trim();
  const it = m.length>2 ? findItem(m) : null;
  if(it){
    const oh=onHand(it.id,wh), rv=reserved(it.id,wh), ls=locsFor(it.id,wh)[0];
    const elsewhere=DB.warehouses.filter(w=>w.id!==wh&&onHand(it.id,w.id)>0);
    return `${esc(iname(it))} (${esc(it.sku)}): ${num(oh)} ${esc(it.uom)} on hand in ${esc(whLabel())}, ${num(rv)} reserved, ${num(oh-rv)} available.${ls?` Stored at <span class="mono xs">${esc(ls.loc)}</span>.`:''} Status: ${STATUS_LABEL[statusOf(it,wh)]}.`+
      (oh<=0&&elsewhere.length?` Other stores hold it: ${elsewhere.map(w=>esc(wname(w))+' '+num(onHand(it.id,w.id))).join(', ')}.`:'');
  }
  return `I can answer questions about stock levels, locations, what moved, what to reorder, what is expiring, dead stock, consumption by project, and inventory value. I could not match that question to your data — try naming an item, a project, or ask "what should I reorder today?"`;
}

/* ---------------- audit trail ---------------- */
VIEWS.audit = function(){
  const list=DB.audit.slice().sort((a,b)=>b.ts-a.ts).slice(0,120);
  return pageHdr('Audit trail', DB.settings.lang==='ar'?'كل إجراء مسجل. لا يمكن حذف الحركات.':'Every action is logged with user, time, old value and new value. Transactions are never deleted — corrections post as reversing entries.',
    `<button class="btn ghost sm" onclick="csv('audit-trail.csv',[['Time','User','Action','Entity','Old','New','Reason','Device']].concat(window._au))">${esc(L('Export CSV'))}</button>`) + `
  <div class="panel"><div class="t-scroll"><table><thead><tr>
    <th>Time</th><th>User</th><th>Action</th><th>Entity</th><th class="r">Old</th><th class="r">New</th><th>Reason</th><th>Device</th></tr></thead><tbody>
    ${list.map(a=>`<tr><td class="xs mono">${tstr(a.ts)}</td><td class="xs">${esc(a.user)}</td>
      <td><span class="tag t-neutral">${esc(a.action)}</span></td><td class="xs mono">${esc(a.entity)}</td>
      <td class="r qty dim">${esc(a.old)}</td><td class="r qty">${esc(a.neu)}</td>
      <td class="xs">${esc(a.reason)}</td><td class="xs dim">${esc(a.device)}</td></tr>`).join('')}
  </tbody></table></div></div>`;
};

/* ---------------- settings ---------------- */
VIEWS.set = function(){
  const s=DB.settings;
  return pageHdr('Settings', DB.settings.lang==='ar'?'إعدادات الشركة والرقابة':'Company identity, control thresholds and regional configuration. Nothing here is hard-coded in the application.') + `
  <div class="grid g2">
    <div class="panel pad">
      <h3 style="margin-bottom:12px">Company</h3>
      <div class="field"><label class="f">Product name</label><input class="f" value="${esc(s.product)}" onchange="DB.settings.product=this.value;logAudit('Setting','Product name','','',this.value);UI.render()"></div>
      <div class="field"><label class="f">Company</label><input class="f" value="${esc(s.company)}" onchange="DB.settings.company=this.value;UI.render()"></div>
      <div class="field"><label class="f">Currency</label><input class="f" value="${esc(s.currency)}" disabled></div>
      <div class="field"><label class="f">Tax rate (%)</label><input class="f num" type="number" value="${s.taxRate}" min="0" step="0.5" onchange="DB.settings.taxRate=+this.value;toast('Tax rate set to '+this.value+'%.')">
        <div class="why" style="margin-top:6px">Set to 0 by default. Qatar VAT is not assumed — change this when it applies to your entity.</div></div>
      <div class="field"><label class="f">Daily report time</label><input class="f" type="time" value="${esc(s.reportTime)}" onchange="DB.settings.reportTime=this.value;toast('Daily report scheduled for '+this.value+'.')"></div>
    </div>
    <div class="panel pad">
      <h3 style="margin-bottom:12px">Stock control</h3>
      <label class="sm" style="display:flex;gap:8px;align-items:flex-start;margin-bottom:12px">
        <input type="checkbox" ${s.allowNegative?'checked':''} onchange="DB.settings.allowNegative=this.checked;logAudit('Setting','Negative stock',!this.checked,this.checked,'');toast(this.checked?'Negative stock is now permitted.':'Negative stock is blocked.');UI.render()">
        <span>Allow negative stock<div class="xs muted">Off by default. When off, an issue larger than available stock is rejected at the point of entry.</div></span></label>
      <label class="sm" style="display:flex;gap:8px;align-items:flex-start;margin-bottom:12px">
        <input type="checkbox" ${s.fefo?'checked':''} onchange="DB.settings.fefo=this.checked;toast(this.checked?'FEFO warnings on.':'FEFO warnings off.')">
        <span>Enforce FEFO warnings<div class="xs muted">Warns the storekeeper when a later-expiry batch is selected while an earlier one is in stock.</div></span></label>
      <div class="field"><label class="f">Dead stock threshold (days)</label>
        <input class="f num" type="number" value="${s.deadDays}" min="30" step="30" onchange="DB.settings.deadDays=+this.value;UI.render();toast('Dead stock threshold set to '+this.value+' days.')"></div>
      <hr class="sep">
      <h4 style="margin-bottom:8px">Adjustment approval thresholds</h4>
      <table><tbody>${s.adjustThresholds.map((t,i)=>`<tr><td class="xs">${i===0?money(0):money(s.adjustThresholds[i-1].max)} – ${t.max===Infinity?'above':money(t.max)}</td>
        <td class="r"><select class="f" style="max-width:190px" onchange="DB.settings.adjustThresholds[${i}].role=this.value;toast('Approval level updated.')">
        ${Object.keys(DB.roles).map(r=>`<option ${t.role===r?'selected':''}>${esc(r)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>
    </div>
  </div>
  <div class="panel pad" style="margin-top:14px">
    <h3 style="margin-bottom:10px">Roles and permissions</h3>
    <div class="t-scroll"><table><thead><tr><th>Role</th><th>Screens</th></tr></thead><tbody>
      ${Object.entries(DB.roles).map(([r,p])=>`<tr><td><strong>${esc(r)}</strong></td>
        <td class="xs muted">${p[0]==='*'?'Full system access':p.map(k=>{const f=NAV.flatMap(g=>g.items).find(i=>i.k===k);return f?f.t:k;}).join(' · ')}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="why" style="margin-top:10px">Switch role from the selector in the header to see the system as that user sees it. Screens outside a role's permission set are not rendered in the navigation and are refused if reached directly.</div>
  </div>
  <div class="panel pad" style="margin-top:14px">
    <h3 style="margin-bottom:10px">Data and recovery</h3>
    <div class="row tight">
      <button class="btn ghost sm" onclick="backup()">Download full backup (JSON)</button>
      <button class="btn ghost sm" onclick="csv('ledger-full.csv',[['Txn','Time','Type','Item','SKU','Qty','Location','Warehouse','Batch','Expiry','Reference','Party','User','Reason']].concat(DB.txns.map(t=>[t.id,tstr(t.ts),t.type,(ITEM(t.itemId)||{}).name,(ITEM(t.itemId)||{}).sku,t.qty,t.locId,t.wh,t.batch,t.expiry,t.ref,t.party,t.user,t.reason])))">Export full ledger</button>
    </div>
    <div class="why" style="margin-top:10px">This prototype keeps data in the browser session. The production build writes to PostgreSQL with scheduled encrypted backups and a restore test, the same pattern as the MIZAN deployment.</div>
  </div>`;
};
function backup(){
  const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),settings:DB.settings,items:DB.items,locations:DB.locations,
    txns:DB.txns,requests:DB.requests,counts:DB.counts,adjustments:DB.adjustments,audit:DB.audit},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='smartware360-backup-'+dstr(Date.now())+'.json'; a.click();
  logAudit('Backup','Full database export','','','Manual download');
  toast('Backup downloaded.');
}

/* ==========================================================================
   Layer 12: boot, offline queue, URL parameters
   ========================================================================== */
window.addEventListener('online', ()=>{
  if(DB.queue.length){ toast(`Back online — ${DB.queue.length} queued transaction${DB.queue.length>1?'s':''} synchronised.`); DB.queue=[]; }
  renderTop();
});
window.addEventListener('offline', ()=>{ toast('Offline. Scanning, counting and transactions keep working and will sync automatically.'); renderTop(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') UI.closeDrawer(); });
setInterval(renderTop, 30000);

(function boot(){
  const p=new URLSearchParams(location.search);
  if(p.get('lang')==='ar') UI.toggleLang();
  if(p.get('wh')&&DB.warehouses.some(w=>w.id===p.get('wh'))) UI.wh=p.get('wh');
  if(p.get('user')&&DB.users.some(u=>u.id===p.get('user'))) UI.user=DB.users.find(u=>u.id===p.get('user'));
  const v=p.get('view'); if(v&&VIEWS[v]&&UI.can(v)) UI.view=v;
  UI.render();
  // exports used by the CSV buttons that build rows lazily
  window._rl = reorderList(UI.wh).map(x=>[x.it.sku,x.it.name,x.available,x.avgDaily,x.lead,x.safety,x.rop,x.dz===Infinity?'':x.dz,x.suggest,(x.suggest*x.it.cost).toFixed(2),DB.suppliers.find(s=>s.id===x.it.supplier).name]);
  window._au = DB.audit.slice().sort((a,b)=>b.ts-a.ts).map(a=>[tstr(a.ts),a.user,a.action,a.entity,a.old,a.neu,a.reason,a.device]);
})();
</script>
